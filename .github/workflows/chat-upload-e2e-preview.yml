name: Chat Upload — Preview Browser Assurance

on:
  deployment_status:

concurrency:
  group: chat-upload-preview-${{ github.event.deployment.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read

jobs:
  upload-preview:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: Preview
    env:
      E2E_BASE_URL: ${{ github.event.deployment_status.target_url }}
      E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
      E2E_OUTSIDER_EMAIL: ${{ secrets.E2E_OUTSIDER_EMAIL }}
      E2E_LANE: pr
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ github.event.deployment.ref }}
      - uses: ./.github/actions/setup-node
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify safe test environment
        run: node scripts/verify-upload-e2e-env.mjs
      - name: Run signed-in preview upload journey
        run: npm run test:e2e:upload:pr
      - name: Upload sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chat-upload-preview-${{ github.run_id }}
          path: playwright-report/upload-e2e-summary.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Notify on failure
        if: failure()
        env:
          E2E_ALERT_WEBHOOK: ${{ secrets.E2E_ALERT_WEBHOOK }}
        run: node scripts/notify-upload-e2e-failure.mjs
